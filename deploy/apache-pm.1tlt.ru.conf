<VirtualHost *:80>
    ServerName pm.1tlt.ru

    ErrorLog ${APACHE_LOG_DIR}/pm.1tlt.ru-error.log
    CustomLog ${APACHE_LOG_DIR}/pm.1tlt.ru-access.log combined

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass /api/v1/ws ws://127.0.0.1:8080/api/v1/ws
    ProxyPassReverse /api/v1/ws ws://127.0.0.1:8080/api/v1/ws
    ProxyPass /api http://127.0.0.1:8080/api
    ProxyPassReverse /api http://127.0.0.1:8080/api
    ProxyPass /actuator http://127.0.0.1:8080/actuator
    ProxyPassReverse /actuator http://127.0.0.1:8080/actuator
    ProxyPass /v3 http://127.0.0.1:8080/v3
    ProxyPassReverse /v3 http://127.0.0.1:8080/v3
    ProxyPass /swagger-ui http://127.0.0.1:8080/swagger-ui
    ProxyPassReverse /swagger-ui http://127.0.0.1:8080/swagger-ui
    ProxyPass /swagger-ui.html http://127.0.0.1:8080/swagger-ui.html
    ProxyPassReverse /swagger-ui.html http://127.0.0.1:8080/swagger-ui.html

    ProxyPass / http://127.0.0.1:8088/
    ProxyPassReverse / http://127.0.0.1:8088/
</VirtualHost>
